[package]
name = "mixlauncher"
version = "2.2.0"
edition = "2024"
rust-version = "1.100"
build = "build.rs"

[[bin]]
name = "mixlauncher"
path = "src/main.rs"

[features]
# build.bat dev: the dev manifest (no elevation prompt) -> mixlauncher-dev.exe
dev = []

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Shutdown",
    "Win32_System_RemoteDesktop",
    "Win32_System_Environment",
    "Win32_System_Variant",
    "Win32_System_WindowsProgramming",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Networking_WinHttp",
    "Win32_Globalization",
    "Win32_Security_Authorization",
]

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_WinRT",
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
]

[dependencies]
windows-future = "0.3"

[build-dependencies]
embed-resource = "3"

[profile.release]
# Speed first: opt-level 3 is faster than "s" on every hot path (search, frame, cache) at about 200 KB more exe
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.dev]
panic = "abort"
